name: nymix_mobile
description: Flutter client for the Nymix music platform.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.3
  http: ^1.2.2
  image_picker: ^1.1.2
  just_audio: ^0.10.6
  record: ^7.1.2
  shared_preferences: ^2.3.2
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

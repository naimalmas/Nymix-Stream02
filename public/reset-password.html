<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261125-1">
  <title>Nymix — Reset password</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0d0520;color:#fff;font:15px Inter,Arial,sans-serif}.card{width:min(100%,420px);padding:34px;border:1px solid #332052;border-radius:22px;background:#171026;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:28px}p{color:#aaa0bd;line-height:1.5}label{display:block;margin:18px 0 7px;color:#cfc4de;font-size:13px}input{width:100%;padding:13px 15px;border:1px solid #3a2a55;border-radius:11px;background:#211932;color:#fff;font:inherit;outline:none}input:focus{border-color:#a855f7;box-shadow:0 0 0 3px #7c3aed33}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.msg{margin-top:14px;padding:11px;border-radius:10px;text-align:center}.error{background:#ef444422;color:#fca5a5}.success{background:#22c55e22;color:#86efac}.hidden{display:none}a{color:#c4b5fd}
  </style>
</head>
<body>
  <main class="card">
    <h1>Set a new password</h1>
    <p>Choose a strong password for your Nymix account.</p>
    <form id="form">
      <label for="password">New password</label><input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
      <label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
      <button type="submit">Update password</button>
    </form>
    <div id="msg" class="msg hidden" role="status"></div>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    function show(text, type){msg.textContent=text;msg.className='msg '+type;}
    if(!token) { form.hidden=true; show('This reset link is invalid or expired.','error'); }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password=document.getElementById('password').value;
      if(password!==document.getElementById('confirm').value) return show('Passwords do not match.','error');
      try {
        const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});
        const data=await response.json();
        if(!response.ok) return show(data.error||'Could not reset password.','error');
        form.hidden=true; show(data.message+' Redirecting to login…','success');
        setTimeout(()=>location.href='/login.html',1400);
      } catch(error) { show('Server connection failed. Please try again.','error'); }
    });
  </script>
</body>
</html>

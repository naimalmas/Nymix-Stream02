<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nymix — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--purple:#7c3aed;--purple-light:#a855f7;--glow:rgba(124,58,237,0.4)}
html,body{height:100%;font-family:'Inter',sans-serif;background:#0d0520;color:#fff;overflow:hidden}
.bg-blob{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none}
.b1{width:600px;height:600px;background:rgba(109,40,217,0.3);top:-200px;left:-200px}
.b2{width:400px;height:400px;background:rgba(79,30,180,0.2);bottom:-100px;right:-100px}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:40px;width:100%;max-width:420px;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.logo{text-align:center;margin-bottom:28px}
.ui-icon{display:inline-block;width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.logo-icon{width:52px;height:52px;background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 25px var(--glow);margin-bottom:10px}
.logo-icon .ui-icon{width:25px;height:25px;color:#fff}
.btn .ui-icon{width:16px;height:16px;margin-left:4px}
.logo h1{font-size:26px;font-weight:800;letter-spacing:-0.5px}
.logo p{color:#9ca3af;font-size:13px;margin-top:4px}
.tabs{display:flex;background:rgba(255,255,255,0.05);border-radius:12px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:9px;text-align:center;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:#9ca3af;transition:all 0.2s}
.tab.active{background:var(--purple);color:#fff;box-shadow:0 4px 15px var(--glow)}
.form-group{margin-bottom:16px}
label{font-size:12px;color:#9ca3af;font-weight:500;display:block;margin-bottom:6px}
input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:all 0.2s}
input:focus{border-color:var(--purple);background:rgba(255,255,255,0.12);box-shadow:0 0 0 3px rgba(124,58,237,0.2)}
input::placeholder{color:#4b5563}
.btn{width:100%;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;box-shadow:0 4px 20px var(--glow);margin-top:4px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--glow)}
.btn:active{transform:translateY(0)}
.msg{font-size:13px;text-align:center;padding:10px;border-radius:10px;margin-top:12px;min-height:20px}
.msg.err{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.msg.ok{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3)}
.divider{text-align:center;color:#4b5563;font-size:12px;margin:16px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:rgba(255,255,255,0.1)}
.divider::before{left:0}.divider::after{right:0}
</style>
</head>
<body>
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <div class="logo-icon"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#music"></use></svg></div>
      <h1>Nymix</h1>
      <p>Your music, your world</p>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
    </div>

    <!-- Login Form -->
    <div id="form-login">
      <div class="form-group"><label>Email</label><input type="email" id="l-email" placeholder="your@email.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••"/></div>
      <button class="btn" onclick="doLogin()">Login <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#arrow-right-long"></use></svg></button>
      <div class="msg" id="l-msg"></div>
    </div>

    <!-- Register Form -->
    <div id="form-register" style="display:none">
      <div class="form-group"><label>Name</label><input type="text" id="r-name" placeholder="Your name"/></div>
      <div class="form-group"><label>Email</label><input type="email" id="r-email" placeholder="your@email.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="r-pass" placeholder="Min 6 characters"/></div>
      <button class="btn" onclick="doRegister()">Create Account <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#arrow-right-long"></use></svg></button>
      <div class="msg" id="r-msg"></div>
    </div>
  </div>
</div>
<script>
const API = '/api';
function switchTab(t){
  document.getElementById('tab-login').classList.toggle('active',t==='login');
  document.getElementById('tab-register').classList.toggle('active',t==='register');
  document.getElementById('form-login').style.display = t==='login'?'block':'none';
  document.getElementById('form-register').style.display = t==='register'?'block':'none';
}
function dashboardPath(role){
  if(role==='super_admin') return '/super-admin/';
  if(role==='admin') return '/admin/';
  return '/';
}
function showMsg(id,text,type){const el=document.getElementById(id);el.textContent=text;el.className='msg '+(type||'err');}
async function doLogin(){
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  if(!email||!pass){showMsg('l-msg','Please fill all fields');return;}
  try{
    const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(!r.ok){showMsg('l-msg',d.error);return;}
    localStorage.setItem('nx_token',d.token);
    localStorage.setItem('nx_user',JSON.stringify(d.user));
    showMsg('l-msg','Login successful! Redirecting...','ok');
    setTimeout(()=>{ window.location.href = dashboardPath(d.user.role); },800);
  }catch(e){showMsg('l-msg','Server connection failed. Is the server running?');}
}
async function doRegister(){
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const pass=document.getElementById('r-pass').value;
  if(!name||!email||!pass){showMsg('r-msg','Please fill all fields');return;}
  if(pass.length<6){showMsg('r-msg','Password min 6 characters');return;}
  try{
    const r=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password:pass})});
    const d=await r.json();
    if(!r.ok){showMsg('r-msg',d.error);return;}
    localStorage.setItem('nx_token',d.token);
    localStorage.setItem('nx_user',JSON.stringify(d.user));
    showMsg('r-msg','Account created! Redirecting...','ok');
    setTimeout(()=>{ window.location.href=dashboardPath(d.user.role); },800);
  }catch(e){showMsg('r-msg','Server connection failed. Is the server running?');}
}
// Enter key
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const f=document.getElementById('form-login').style.display!=='none'; f?doLogin():doRegister(); } });
// Auto redirect if already logged in
const u=JSON.parse(localStorage.getItem('nx_user')||'null');
const t=localStorage.getItem('nx_token');
if(u && t){ window.location.href = dashboardPath(u.role); }
</script>
</body>
</html>
